<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omniscol</title>
    <style>
        .pace {
            -webkit-pointer-events: none;
            pointer-events: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        .pace-inactive {
            display: none;
        }

        .pace .pace-progress {
            background: var(--os-main-color, #1bc5b3);
            position: fixed;
            z-index: 200000;
            top: 0;
            right: 100%;
            width: 100%;
            height: 4px;
        }
    </style>
    <script type="text/javascript">
        paceOptions = {
            ajax: {
                trackWebSockets: false,
                ignoreURLs: [/socket.io\/.*/, '/api/user/keep-alive']
            }
        }
    </script>
    <script src="/public/js/pace.min.js"></script>
    <link rel="icon" type="image/png" href="/public/images/favicon.png" class="omniscolicon">


    <link rel="stylesheet" href="/webapp/css/lib.min.css">
    <link rel="stylesheet" href="/core/css/core.min.css">
    <link rel="stylesheet" href="/webapp/css/modules.min.css">

</head>

<body class="omniscolbody">
    <div class="omniscol">
    </div>


    <script type="text/javascript" src="/webapp/js/lib.min.js"></script>
    <script type="text/javascript" src="/webapp/js/libadmin.min.js"></script>
    <script type="text/javascript" src="/core/js/core.min.js"></script>
    <script type="text/javascript" src="/webapp/js/components.min.js"></script>
    <script type="text/javascript" src="/webapp/js/home.min.js"></script>
    <script type="text/javascript" src="/webapp/js/schedules.min.js"></script>
    <script type="text/javascript" src="/webapp/js/dashboard.min.js"></script>
    <script type="text/javascript" src="/webapp/js/absences.min.js"></script>
    <script type="text/javascript" src="/webapp/js/timetables.min.js"></script>
    <script type="text/javascript" src="/webapp/js/admin.min.js"></script>

    <script type="text/javascript">

        OS.initConfig({
            WEBAPP_NAME: 'Omniscol',
            WEBAPP_TYPE: 'webapp',
            PORTAL_DOMAIN: 'http://www.omniscol.com/',
            HEADER_NAME: 'X-Omniscol-Domain',
            API_DOMAIN: '/',
            LOCALE_DEFAULT: 'fr',
            SCHOOL: 'sandboxai',
            URL_PREFIX: '',
            HTML5ROUTING: true,
            IGNORESUBPREFIX: true,
            COOKIE_NAME: 'authtoken',
            COOKIE_DOMAIN: 'sandboxai.omniscol.com',
            TYPE: 'premium',
            COUNTRY: 'fr',
            LOGGED: false,
            VIEW: {
                header: {
                    search: true,
                    image: '/public/images/webapp/logo-color-w160@2x.png'
                },
                modules: true,
                notifications: true,
                loadingscreen: 'cloudloading'
            }
        });

        $(OS.initialLoading);
    </script>

</body>

</html>
